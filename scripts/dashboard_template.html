<style>
  /* ---- tokens: both themes, driven off the dataviz reference palette ---- */
  :root{
    --plane:#f9f9f7; --surface:#fcfcfb; --surface-2:#f3f2ee;
    --ink:#0b0b0b; --ink-2:#52514e; --muted:#8a8880;
    --grid:#e4e3dc; --border:rgba(11,11,11,.10); --track:#eae9e2;
    --accent:#2a78d6; --aqua:#178a63; --violet:#4a3aa7;
    --good:#0a8f0a; --warning:#b07400; --critical:#c62f2f; --serious:#c05a2f;
    --shadow:0 1px 2px rgba(11,11,11,.05),0 8px 24px rgba(11,11,11,.06);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --plane:#0d0d0d; --surface:#1a1a19; --surface-2:#222220;
      --ink:#fff; --ink-2:#c3c2b7; --muted:#8f8d85;
      --grid:#2c2c2a; --border:rgba(255,255,255,.10); --track:#26261f;
      --accent:#3987e5; --aqua:#199e70; --violet:#9085e9;
      --good:#0ca30c; --warning:#fab219; --critical:#e05656; --serious:#ec835a;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --plane:#0d0d0d; --surface:#1a1a19; --surface-2:#222220;
    --ink:#fff; --ink-2:#c3c2b7; --muted:#8f8d85;
    --grid:#2c2c2a; --border:rgba(255,255,255,.10); --track:#26261f;
    --accent:#3987e5; --aqua:#199e70; --violet:#9085e9;
    --good:#0ca30c; --warning:#fab219; --critical:#e05656; --serious:#ec835a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  }
  :root[data-theme="light"]{
    --plane:#f9f9f7; --surface:#fcfcfb; --surface-2:#f3f2ee;
    --ink:#0b0b0b; --ink-2:#52514e; --muted:#8a8880;
    --grid:#e4e3dc; --border:rgba(11,11,11,.10); --track:#eae9e2;
    --accent:#2a78d6; --aqua:#178a63; --violet:#4a3aa7;
    --good:#0a8f0a; --warning:#b07400; --critical:#c62f2f; --serious:#c05a2f;
    --shadow:0 1px 2px rgba(11,11,11,.05),0 8px 24px rgba(11,11,11,.06);
  }

  *{box-sizing:border-box;}
  .dash{
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    background:var(--plane); color:var(--ink);
    min-height:100vh; padding:clamp(14px,2.5vw,28px);
    line-height:1.45; -webkit-font-smoothing:antialiased;
  }
  .dash h1,.dash h2,.dash h3{margin:0; text-wrap:balance;}
  .mono{font-family:var(--mono); font-variant-numeric:tabular-nums;}
  .wrap{max-width:1280px; margin:0 auto; display:flex; flex-direction:column; gap:18px;}

  /* ---- top bar ---- */
  .topbar{display:flex; flex-wrap:wrap; align-items:center; gap:10px 18px;
    padding-bottom:14px; border-bottom:1px solid var(--grid);}
  .brand{display:flex; align-items:baseline; gap:10px; margin-right:auto;}
  .brand .dot{width:9px; height:9px; border-radius:50%; background:var(--good);
    box-shadow:0 0 0 0 var(--good); align-self:center;}
  .brand .dot.live{animation:pulse 2s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(12,163,12,.5);}70%{box-shadow:0 0 0 7px rgba(12,163,12,0);}100%{box-shadow:0 0 0 0 rgba(12,163,12,0);}}
  @media (prefers-reduced-motion:reduce){.brand .dot.live{animation:none;}}
  .brand h1{font-size:17px; font-weight:650; letter-spacing:-.01em;}
  .brand .sub{color:var(--muted); font-size:12.5px; letter-spacing:.02em;}
  .chips{display:flex; flex-wrap:wrap; gap:6px;}
  .chip{font-family:var(--mono); font-size:11.5px; color:var(--ink-2);
    background:var(--surface-2); border:1px solid var(--border); border-radius:999px;
    padding:3px 9px; white-space:nowrap;}
  .chip b{color:var(--ink); font-weight:600;}
  .chip.off{opacity:.5;}
  .toggle{font:inherit; font-size:12px; color:var(--ink-2); cursor:pointer;
    background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:5px 10px;}
  .toggle:hover{color:var(--ink); border-color:var(--muted);}
  .toggle:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  /* ---- KPI tiles ---- */
  .kpis{display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(140px,1fr));}
  .tile{background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:13px 15px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:3px;}
  .tile .k{font-size:11.5px; color:var(--muted); letter-spacing:.03em; text-transform:uppercase;}
  .tile .v{font-family:var(--mono); font-size:26px; font-weight:640; letter-spacing:-.02em;}
  .tile .cap{font-size:11.5px; color:var(--ink-2);}
  .tile.accent .v{color:var(--accent);} .tile.aqua .v{color:var(--aqua);}
  .tile.violet .v{color:var(--violet);} .tile.good .v{color:var(--good);}
  .tile.crit .v{color:var(--critical);}

  /* ---- panels / charts ---- */
  .cols{display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(300px,1fr));}
  .panel{background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:16px 17px; box-shadow:var(--shadow);}
  .panel > header{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:13px;}
  .panel h2{font-size:13.5px; font-weight:640; letter-spacing:.01em;}
  .panel .hint{font-size:11.5px; color:var(--muted);}

  .barlist{display:flex; flex-direction:column; gap:8px;}
  .barrow{display:grid; grid-template-columns:96px 1fr 34px; align-items:center; gap:10px;}
  .barrow .lab{font-size:12px; color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .barrow .val{font-family:var(--mono); font-size:12px; color:var(--ink-2); text-align:right;}
  .track{height:9px; background:var(--track); border-radius:999px; overflow:hidden;}
  .fill{height:100%; border-radius:999px; background:var(--accent); min-width:3px;}

  /* histogram */
  .hist{display:flex; align-items:flex-end; gap:3px; height:104px; padding-top:6px;}
  .hist .col{flex:1; display:flex; flex-direction:column; justify-content:flex-end; height:100%;}
  .hist .bar{background:var(--accent); border-radius:4px 4px 2px 2px; min-height:2px; transition:height .2s;}
  .hist .bar.dim{background:var(--track);}
  .axis{display:flex; justify-content:space-between; margin-top:6px; font-size:10.5px; color:var(--muted);}

  /* ---- candidate tables ---- */
  .table{background:var(--surface); border:1px solid var(--border); border-radius:14px;
    box-shadow:var(--shadow); overflow:hidden;}
  .table > header{display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--grid);}
  .table > header .stripe{width:4px; height:18px; border-radius:2px; background:var(--accent);}
  .table.sweet > header .stripe{background:var(--accent);}
  .table.value > header .stripe{background:var(--aqua);}
  .table.up > header .stripe{background:var(--violet);}
  .table h2{font-size:13.5px; font-weight:640;}
  .table .count{margin-left:auto; font-family:var(--mono); font-size:12px; color:var(--muted);}
  .scroll{overflow-x:auto;}
  table{width:100%; border-collapse:collapse; font-size:12.5px; min-width:560px;}
  thead th{font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted);
    text-align:left; font-weight:600; padding:8px 12px; position:sticky; top:0; background:var(--surface);}
  thead th.num,tbody td.num{text-align:right;}
  tbody td{padding:9px 12px; border-top:1px solid var(--grid); vertical-align:middle;}
  tbody tr:hover{background:var(--surface-2);}
  tbody tr.trap{box-shadow:inset 3px 0 0 var(--critical);}
  .tkr{font-family:var(--mono); font-weight:640; font-size:13px; letter-spacing:.01em;}
  .comp{font-family:var(--mono); font-weight:640;}
  .sub{display:inline-grid; grid-template-columns:14px 40px; align-items:center; gap:5px;}
  .sub .n{font-family:var(--mono); font-size:11px; color:var(--ink-2); text-align:right;}
  .microtrack{height:6px; width:40px; background:var(--track); border-radius:999px; overflow:hidden;}
  .microfill{height:100%; background:var(--accent); border-radius:999px;}
  .flags{display:flex; flex-wrap:wrap; gap:4px;}
  .flag{font-size:10.5px; color:var(--ink-2); background:var(--surface-2);
    border:1px solid var(--border); border-radius:6px; padding:1px 6px; white-space:nowrap;}
  .flag.good{color:var(--good); border-color:color-mix(in srgb,var(--good) 35%,transparent);}
  .flag.crit{color:var(--critical); border-color:color-mix(in srgb,var(--critical) 40%,transparent); font-weight:600;}
  .sect{font-size:11px; color:var(--muted);}
  .foot{color:var(--muted); font-size:11.5px; text-align:center; padding:6px 0 2px;}
  .foot a{color:var(--accent); text-decoration:none;}
  .empty{color:var(--muted); font-size:12.5px; padding:16px;}
</style>

<div class="dash">
 <div class="wrap">
  <div class="topbar">
    <div class="brand">
      <span class="dot" id="livedot"></span>
      <h1>Market Scanner</h1>
      <span class="sub" id="subtitle">S&amp;P 500 · 저평가 &amp; 상승 모니터</span>
    </div>
    <div class="chips" id="statuschips"></div>
    <button class="toggle" id="themebtn" type="button" aria-label="테마 전환">◐ 테마</button>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="cols">
    <section class="panel">
      <header><h2>섹터 분포</h2><span class="hint">후보 종목 기준</span></header>
      <div class="barlist" id="sectorchart"></div>
    </section>
    <section class="panel">
      <header><h2>주요 신호 빈도</h2><span class="hint">플래그 집계</span></header>
      <div class="barlist" id="signalchart"></div>
    </section>
    <section class="panel">
      <header><h2>종합점수 분포</h2><span class="hint" id="histhint"></span></header>
      <div class="hist" id="hist"></div>
      <div class="axis"><span>0</span><span>25</span><span>50</span><span>75</span><span>100</span></div>
    </section>
  </div>

  <section class="table sweet">
    <header><span class="stripe"></span><h2>SWEET SPOT — 저평가 &amp; 상승</h2><span class="count" id="c-sweet"></span></header>
    <div class="scroll"><table id="t-sweet"></table></div>
  </section>
  <div class="cols">
    <section class="table value">
      <header><span class="stripe"></span><h2>저평가 (UNDERVALUED)</h2><span class="count" id="c-value"></span></header>
      <div class="scroll"><table id="t-value"></table></div>
    </section>
    <section class="table up">
      <header><span class="stripe"></span><h2>상승 (UPTREND)</h2><span class="count" id="c-up"></span></header>
      <div class="scroll"><table id="t-up"></table></div>
    </section>
  </div>

  <div class="foot" id="foot"></div>
 </div>
</div>

<script>
window.__DASHBOARD__ = /*__DATA__*/ null;
(function(){
  const d = window.__DASHBOARD__ || {};
  const scan = d.scan || {};
  const $ = s => document.querySelector(s);
  const el = (t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};
  const isTrap = e => (e.flags||[]).some(f=>/negative margins/i.test(f));

  // ---- theme toggle ----
  const btn = $('#themebtn');
  const cur = () => document.documentElement.getAttribute('data-theme')
     || (matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  btn.onclick = ()=>document.documentElement.setAttribute('data-theme', cur()==='dark'?'light':'dark');

  // ---- status chips ----
  const cov = scan.coverage || {};
  const covChips = Object.keys(cov).map(k=>{
    const n = cov[k];
    return `<span class="chip ${n?'':'off'}">${k} <b>${n||0}</b></span>`;
  }).join('');
  $('#statuschips').innerHTML =
    `<span class="chip">스캔 <b>${scan.date||'—'}</b></span>` +
    `<span class="chip">종목 <b>${scan.scored||0}</b>/<b>${scan.scanned||0}</b></span>` +
    (scan.errors?`<span class="chip">스킵 <b>${scan.errors}</b></span>`:'') + covChips;
  if(d.subtitle) $('#subtitle').textContent = d.subtitle;

  // ---- live dot ----
  const dot = $('#livedot');
  if(d.live){ dot.classList.add('live'); dot.title='실시간(자동 새로고침)'; }
  else { dot.style.background='var(--muted)'; dot.title='정적 스냅샷'; }

  // ---- KPIs ----
  const uniq = {};
  [].concat(scan.value_and_momentum||[], scan.undervalued||[], scan.uptrend||[])
    .forEach(e=>{ uniq[e.ticker]=e; });
  const traps = Object.values(uniq).filter(isTrap).length;
  const comps = scan.composites || [];
  const avg = comps.length ? (comps.reduce((a,b)=>a+b,0)/comps.length) : null;
  const j = d.journal||{};
  const tiles = [
    ['유니버스', (scan.universe_size||0), (scan.indices||[]).join(' · '), ''],
    ['SWEET SPOT', (scan.value_and_momentum||[]).length, '저평가 & 상승', 'accent'],
    ['저평가', (scan.undervalued||[]).length, 'cheap + quality', 'aqua'],
    ['상승', (scan.uptrend||[]).length, 'momentum + growth', 'violet'],
    ['평균 종합점수', avg==null?'—':avg.toFixed(1), '스캔 전체', ''],
    ['밸류트랩 경고', traps, '적자기업 후보', traps?'crit':''],
  ];
  if(j && j.reviewed){
    tiles.push(['적중률', (j.hit_rate_pct==null?'—':j.hit_rate_pct+'%'), `리뷰 ${j.reviewed}건`, 'good']);
    tiles.push(['평균 알파', (j.avg_alpha_pct==null?'—':(j.avg_alpha_pct>0?'+':'')+j.avg_alpha_pct+'%'), 'vs SPY', j.avg_alpha_pct>0?'good':'crit']);
  }
  $('#kpis').innerHTML = tiles.map(([k,v,cap,cls])=>
    `<div class="tile ${cls}"><span class="k">${k}</span><span class="v">${v}</span><span class="cap">${cap}</span></div>`).join('');

  // ---- horizontal bar list ----
  function barlist(node, rows){
    node.innerHTML='';
    if(!rows.length){ node.appendChild(el('div','empty','데이터 없음 (라이브 스캔에서 채워집니다)')); return; }
    const max = Math.max(...rows.map(r=>r[1]));
    rows.forEach(([lab,v])=>{
      const row=el('div','barrow');
      row.innerHTML=`<span class="lab" title="${lab}">${lab}</span>`+
        `<span class="track"><span class="fill" style="width:${max?Math.max(3,v/max*100):0}%"></span></span>`+
        `<span class="val">${v}</span>`;
      node.appendChild(row);
    });
  }
  // sectors
  const sect={};
  Object.values(uniq).forEach(e=>{ const s=(e.metrics||{}).sector; if(s) sect[s]=(sect[s]||0)+1; });
  barlist($('#sectorchart'), Object.entries(sect).sort((a,b)=>b[1]-a[1]).slice(0,8));
  // signals
  const norm=f=>{
    f=f.toLowerCase();
    if(f.includes('golden')) return '골든크로스';
    if(f.includes('above 200')) return '200일선 위';
    if(f.includes('below 200')) return '200일선 아래';
    if(f.includes('forward p/e')) return '포워드 P/E 개선';
    if(f.includes('low p/e')) return '저 P/E';
    if(f.startsWith('peg')||f.includes('peg')) return 'PEG < 1';
    if(f.includes('negative margins')) return '적자마진';
    if(f.includes('52w high')) return '52주 신고가 근접';
    if(f.includes('52w low')) return '52주 신저가 근접';
    if(f.startsWith('roe')||f.includes('roe')) return '고 ROE';
    if(f.includes('revenue')) return '매출 성장';
    if(f.includes('earnings')) return '이익 성장';
    if(f.includes('leverage')) return '고레버리지';
    return null;
  };
  const sig={};
  Object.values(uniq).forEach(e=>(e.flags||[]).forEach(f=>{const n=norm(f); if(n) sig[n]=(sig[n]||0)+1;}));
  barlist($('#signalchart'), Object.entries(sig).sort((a,b)=>b[1]-a[1]).slice(0,9));

  // ---- histogram of composites ----
  const bins=new Array(20).fill(0);
  comps.forEach(c=>{ let i=Math.min(19,Math.max(0,Math.floor(c/5))); bins[i]++; });
  const hmax=Math.max(1,...bins);
  $('#hist').innerHTML = bins.map((n,i)=>{
    const lo=i*5, hi=lo+5;
    return `<div class="col" title="${lo}–${hi}점: ${n}종목"><div class="bar ${n?'':'dim'}" style="height:${n/hmax*100}%"></div></div>`;
  }).join('');
  $('#histhint').textContent = comps.length ? `n=${comps.length}` : '';

  // ---- candidate tables ----
  function subcell(v){
    return `<span class="sub"><span class="microtrack"><span class="microfill" style="width:${Math.max(2,v)}%"></span></span><span class="n">${Math.round(v)}</span></span>`;
  }
  function flagcell(e){
    return `<span class="flags">`+(e.flags||[]).slice(0,4).map(f=>{
      const t=isTrapFlag(f); return `<span class="flag ${t?'crit':(isGood(f)?'good':'')}">${f}</span>`;
    }).join('')+`</span>`;
  }
  const isTrapFlag=f=>/negative margins|high leverage/i.test(f);
  const isGood=f=>/golden|above 200|peg|low p\/e|roe|forward p\/e|revenue|earnings|52w high/i.test(f);
  function fill(id, rows){
    const t=$(id);
    if(!rows || !rows.length){ t.innerHTML=`<tbody><tr><td class="empty">이 배치에는 해당 후보가 없습니다</td></tr></tbody>`; return; }
    t.innerHTML =
      `<thead><tr><th>티커</th><th class="num">종합</th><th>V</th><th>M</th><th>Q</th><th>G</th><th>섹터</th><th>신호</th></tr></thead><tbody>`+
      rows.map(e=>{
        const trap=isTrap(e);
        const sc=(e.metrics||{}).sector||'';
        return `<tr class="${trap?'trap':''}">`+
          `<td><span class="tkr">${e.ticker}</span>${trap?' <span class="flag crit" title="적자">적자</span>':''}</td>`+
          `<td class="num comp">${e.composite}</td>`+
          `<td class="num">${subcell(e.valuation)}</td>`+
          `<td class="num">${subcell(e.momentum)}</td>`+
          `<td class="num">${subcell(e.quality)}</td>`+
          `<td class="num">${subcell(e.growth)}</td>`+
          `<td><span class="sect">${sc}</span></td>`+
          `<td>${flagcell(e)}</td></tr>`;
      }).join('')+`</tbody>`;
  }
  fill('#t-sweet', scan.value_and_momentum);
  fill('#t-value', scan.undervalued);
  fill('#t-up', scan.uptrend);
  $('#c-sweet').textContent = (scan.value_and_momentum||[]).length+'종목';
  $('#c-value').textContent = (scan.undervalued||[]).length+'종목';
  $('#c-up').textContent = (scan.uptrend||[]).length+'종목';

  // ---- footer + auto-refresh ----
  $('#foot').innerHTML = `생성 ${d.generated_at||'—'} · 의사결정 지원용이며 투자자문이 아닙니다`+
     (d.live?` · ${d.refresh_seconds||60}초마다 자동 새로고침`:'');
  if(d.live && d.refresh_seconds){ setTimeout(()=>location.reload(), d.refresh_seconds*1000); }
})();
</script>
